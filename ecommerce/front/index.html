<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Ecommerce</title>
</head>
<body>
    <div class="card">
        <h2>Catálogo de Produtos (REST)</h2>
        <button onclick="carregarProdutos()">Carregar / Atualizar Produtos</button>
        
        <table id="tabela-produtos">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Preço (R$)</th>
                    <th>Estoque</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="4">Clique no botão acima para carregar o catálogo.</td></tr>
            </tbody>
        </table>
    </div>
    <script src="script.js"></script>
</body>
</html>
